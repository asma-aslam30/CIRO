name: Deploy ciro-backend to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'ciro-backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  GCP_REGION: us-central1
  SERVICE_NAME: ciro-backend

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ciro-images/ciro-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Verify authentication
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: GCP_SA_KEY secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ ERROR: GCP_PROJECT_ID secret is not set!"
            exit 1
          fi
          echo "✅ GCP_SA_KEY secret is configured"
          echo "✅ GCP_PROJECT_ID secret is configured"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Create Artifact Registry repo (if not exists)
        run: |
          gcloud artifacts repositories describe ciro-images \
            --location=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null || \
          gcloud artifacts repositories create ciro-images \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ./ciro-backend

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --port=8000 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --set-env-vars="ALLOWED_ORIGINS=https://ciro-web-next-831760955449.us-central1.run.app" \
            --quiet

      - name: Print deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ Backend deployed at: $URL"
          echo "BACKEND_URL=$URL" >> $GITHUB_ENV

      - name: Verify deployment
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -s "${{ env.BACKEND_URL }}" > /dev/null; then
              echo "✅ Backend is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done
          echo "⚠️  Backend deployment verification timed out, but service was created"
