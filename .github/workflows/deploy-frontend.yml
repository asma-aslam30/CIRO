name: Deploy ciro-web-next to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'ciro-web-next/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  GCP_REGION: us-central1
  SERVICE_NAME: ciro-web-next
  BACKEND_SERVICE: ciro-backend

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ciro-images/ciro-web-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Verify authentication
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ ERROR: GCP_SA_KEY secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ ERROR: GCP_PROJECT_ID secret is not set!"
            exit 1
          fi
          echo "✅ GCP_SA_KEY secret is configured"
          echo "✅ GCP_PROJECT_ID secret is configured"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Create Artifact Registry repo (if not exists)
        run: |
          gcloud artifacts repositories describe ciro-images \
            --location=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null || \
          gcloud artifacts repositories create ciro-images \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            echo "⚠️  Backend not deployed yet. Using fallback URL."
            URL="https://ciro-backend-avlzdriwhq-uc.a.run.app"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $URL"

      - name: Build Docker image
        run: |
          BACKEND_URL="${{ steps.backend.outputs.url }}"
          echo "Building with Backend URL: $BACKEND_URL"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL/api \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ./ciro-web-next

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --quiet

      - name: Update backend CORS with frontend URL
        continue-on-error: true
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)")

          echo "Frontend URL: $FRONTEND_URL"

          # Update backend ALLOWED_ORIGINS to include this frontend
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="ALLOWED_ORIGINS=$FRONTEND_URL" \
            --quiet 2>/dev/null || echo "⚠️  Backend not yet deployed. CORS will need manual update."

          echo "✅ Frontend deployed at: $FRONTEND_URL"
          echo "✅ Backend CORS updated to allow: $FRONTEND_URL"

      - name: Update frontend with backend URL
        continue-on-error: true
        run: |
          BACKEND_URL="${{ steps.backend.outputs.url }}"
          
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="NEXT_PUBLIC_API_URL=$BACKEND_URL/api" \
            --quiet 2>/dev/null || echo "⚠️  Could not update frontend environment variables."
          
          echo "✅ Frontend updated with backend URL: $BACKEND_URL/api"
